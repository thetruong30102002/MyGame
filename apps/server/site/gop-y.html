<!doctype html>
<html lang="vi" data-theme="aether">
<head>
<meta charset="utf-8">
<script>
	// …/gop-y/ (thừa "/" cuối) thì đường dẫn tương đối api/…, site/… trỏ sai gốc → bỏ "/".
	if (/\/[a-z-]+\/$/.test(location.pathname) && !/\/game\/$/.test(location.pathname)) location.replace(location.pathname.slice(0, -1) + location.search + location.hash);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Góp ý — Aether Chronicle</title>
<meta name="description" content="Báo lỗi, gửi ý tưởng cho đội làm game Aether Chronicle và xem trả lời.">
<meta name="theme-color" content="#0d1a2a">
<link rel="icon" href="site/img/favicon.png">
<link rel="preload" href="site/fonts/bvp-400-vietnamese.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="site/app.css">
</head>
<body data-page="gop-y" class="bg-base-200 text-base-content antialiased overflow-x-hidden">
<main id="main">
	<div class="max-w-2xl mx-auto px-4 pt-6 pb-10 sm:pt-12">
		<p class="text-xs font-black tracking-widest text-primary">GÓP Ý</p>
		<h1 class="mt-1 text-[28px] sm:text-4xl font-black leading-tight">Góp ý · báo lỗi</h1>

		<div class="mt-4 flex items-end gap-3">
			<img class="px h-16 w-auto shrink-0" src="site/img/ysolde.png" alt="Bà Ysolde" width="148" height="224">
			<div class="relative rounded-2xl rounded-bl-md bg-base-100 border border-white/10 px-4 py-3">
				<p class="text-[13px] font-semibold text-primary">Bà Ysolde</p>
				<p class="mt-1 text-[15px] leading-relaxed">Gặp lỗi hay muốn game có thêm gì? Kể bà nghe — cháu xem được trả lời của đội làm game ngay ở trang này.</p>
			</div>
		</div>

		<form id="fb-form" class="mt-6 rounded-2xl bg-base-100 border border-white/10 p-4 sm:p-6 space-y-5">
			<fieldset>
				<legend class="text-sm font-semibold mb-2">Bạn muốn gửi gì?</legend>
				<div class="grid grid-cols-3 gap-2">
					<label class="cursor-pointer"><input type="radio" name="kind" value="loi" class="peer sr-only" checked>
						<span class="flex flex-col items-center justify-center gap-1.5 h-20 rounded-xl border-2 border-white/10 bg-base-200 text-base-content/70 peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary peer-focus-visible:ring-2 ring-primary transition-colors">
							<svg class="i w-6 h-6"><use href="#i-bug"/></svg><span class="text-sm font-semibold leading-none">Báo lỗi</span></span></label>
					<label class="cursor-pointer"><input type="radio" name="kind" value="y-tuong" class="peer sr-only">
						<span class="flex flex-col items-center justify-center gap-1.5 h-20 rounded-xl border-2 border-white/10 bg-base-200 text-base-content/70 peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary peer-focus-visible:ring-2 ring-primary transition-colors">
							<svg class="i w-6 h-6"><use href="#i-bulb"/></svg><span class="text-sm font-semibold leading-none">Ý tưởng</span></span></label>
					<label class="cursor-pointer"><input type="radio" name="kind" value="khac" class="peer sr-only">
						<span class="flex flex-col items-center justify-center gap-1.5 h-20 rounded-xl border-2 border-white/10 bg-base-200 text-base-content/70 peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary peer-focus-visible:ring-2 ring-primary transition-colors">
							<svg class="i w-6 h-6"><use href="#i-chat"/></svg><span class="text-sm font-semibold leading-none">Khác</span></span></label>
				</div>
			</fieldset>
			<label class="block">
				<span class="flex justify-between text-sm font-semibold mb-1.5"><span>Nội dung</span><span class="font-normal text-base-content/50"><span id="fb-cnt">0</span>/1000</span></span>
				<textarea id="fb-text" class="textarea textarea-bordered w-full min-h-32 text-base leading-relaxed" maxlength="1000" required></textarea>
				<span id="fb-hint" class="block mt-1.5 text-[13px] leading-relaxed text-base-content/55"></span>
			</label>
			<label class="block">
				<span class="block text-sm font-semibold mb-1.5">Nhân vật gặp chuyện <span class="font-normal text-base-content/50">(không bắt buộc)</span></span>
				<select id="fb-char" class="select select-bordered w-full text-base"></select>
			</label>
			<div id="fb-err" role="alert" class="alert alert-error py-2 text-sm" hidden></div>
			<button class="btn btn-primary w-full h-12 gap-2" id="fb-go"><svg class="i w-5 h-5"><use href="#i-send"/></svg><span id="fb-go-t">Gửi góp ý</span></button>
			<p class="text-xs leading-relaxed text-base-content/50 text-center">Cần đăng nhập để đội làm game trả lời được bạn. Trong game: Cài đặt (O) → Góp ý.</p>
		</form>

		<section class="mt-10" aria-labelledby="mine-title">
			<div class="flex items-center justify-between gap-2 mb-3">
				<h2 id="mine-title" class="font-black text-xl">Góp ý của bạn</h2>
				<button id="mine-reload" class="btn btn-ghost btn-sm h-10 min-h-10 gap-1.5" type="button" hidden><svg class="i w-4 h-4"><use href="#i-refresh"/></svg>Tải lại</button>
			</div>
			<div id="mine" class="space-y-3"></div>
		</section>
	</div>
</main>

<script src="site/vendor/sweetalert2.min.js"></script>
<script src="site/common.js"></script>
<script>
(function () {
	const { $, h } = A;
	const HINT = {
		loi: 'Kể rõ: bạn đang làm gì, ở map nào, lỗi hiện ra sao, chơi trên PC hay điện thoại.',
		'y-tuong': 'Muốn game có thêm gì? Tính năng, vùng đất, quái, trang bị… cứ kể.',
		khac: 'Bất cứ điều gì bạn muốn nói với đội làm game.',
	};
	const PH = { loi: 'VD: Ở map Đầm lầy 3, đánh Hydra bùn xong thì nhân vật kẹt không đi được…', 'y-tuong': 'VD: Mong có thú cưỡi để đi nhanh hơn giữa các vùng…', khac: 'Viết gì đó…' };
	const kind = () => document.querySelector('[name="kind"]:checked').value;
	const onKind = () => {
		$('fb-hint').textContent = HINT[kind()];
		$('fb-text').placeholder = PH[kind()];
	};
	document.querySelectorAll('[name="kind"]').forEach((r) => r.addEventListener('change', onKind));
	onKind();
	A.autosize($('fb-text'), 360);
	$('fb-text').addEventListener('input', () => ($('fb-cnt').textContent = $('fb-text').value.length));

	$('fb-form').onsubmit = (e) => {
		e.preventDefault();
		A.need(send);
	};
	async function send() {
		A.showErr('fb-err');
		$('fb-go').classList.add('btn-disabled');
		try {
			await A.api('POST', 'feedback', { text: $('fb-text').value, kind: kind(), characterId: $('fb-char').value || undefined, platform: 'web' });
			$('fb-text').value = '';
			$('fb-text').dispatchEvent(new Event('input'));
			A.toast('Đã gửi — cảm ơn bạn! Trả lời sẽ hiện ở mục "Góp ý của bạn".');
			loadMine();
			$('mine-title').scrollIntoView({ behavior: A.reduce ? 'auto' : 'smooth' });
		} catch (x) {
			A.showErr('fb-err', x.message);
		} finally {
			$('fb-go').classList.remove('btn-disabled');
		}
	}

	async function loadMine() {
		const box = $('mine');
		if (!A.me) {
			$('mine-reload').hidden = true;
			return box.replaceChildren(h('div.rounded-2xl.bg-base-100.border.border-white/10.p-6.text-center', null,
				A.icon('inbox', 'w-10 h-10 mx-auto text-base-content/30'),
				h('p.mt-3.text-[15px].leading-relaxed.text-base-content/70', null, 'Đăng nhập để xem lại góp ý đã gửi và trả lời của đội làm game.'),
				h('button.btn.btn-primary.mt-4.gap-2', { type: 'button', onclick: () => A.openAuth('login') }, A.icon('user', 'w-5 h-5'), 'Đăng nhập')));
		}
		$('mine-reload').hidden = false;
		box.replaceChildren(h('div.skeleton.h-24'));
		try {
			const list = await A.api('GET', 'feedback/mine');
			box.replaceChildren(...(list.length ? list : [null]).map((f) =>
				!f
					? h('p.text-base-content/55.text-center.py-6', null, 'Bạn chưa gửi góp ý nào.')
					: h('article.rounded-2xl.bg-base-100.border.border-white/10.p-4.sm:p-5', null,
						h('div.flex.flex-wrap.items-center.gap-2', null,
							h('span.inline-flex.items-center.gap-1.5.h-7.px-2.5.rounded-full.bg-white/5.border.border-white/10.text-xs.font-semibold', null, A.icon(A.FB_KIND_ICON[f.kind] || 'chat', 'w-3.5 h-3.5'), A.FB_KINDS[f.kind] || f.kind),
							h('span.badge.badge-sm.font-semibold.' + (A.FB_STATUS_CLS[f.status] || 'badge-ghost'), null, A.FB_STATUS[f.status] || f.status),
							h('time.ml-auto.text-xs.text-base-content/50', null, A.ago(f.at)),
						),
						h('p.mt-3.text-[15px].leading-relaxed.whitespace-pre-wrap.break-words', null, f.text),
						f.reply
							? h('div.mt-3.flex.gap-3.p-3.rounded-xl.bg-primary/10.border.border-primary/25', null,
								h('img.px.w-8.h-auto.shrink-0.self-start.mt-0.5', { src: 'site/img/favicon.png', alt: '' }),
								h('div.min-w-0', null,
									h('p.text-[13px].font-semibold.text-primary.leading-tight', null, 'Đội làm game · ' + A.ago(f.replyAt)),
									h('p.mt-1.text-[15px].leading-relaxed.whitespace-pre-wrap.break-words', null, f.reply)))
							: null,
					),
			));
		} catch (e) {
			box.replaceChildren(h('div.alert.alert-error', null, e.message));
		}
	}
	$('mine-reload').onclick = loadMine;
	A.onMe((me) => {
		$('fb-char').replaceChildren(h('option', { value: '' }, '— Không chọn —'), ...(me ? me.characters.map((c) => h('option', { value: c.id }, c.name)) : []));
		$('fb-go-t').textContent = me ? 'Gửi góp ý' : 'Đăng nhập & gửi góp ý';
		loadMine();
	});
})();
</script>
</body>
</html>
