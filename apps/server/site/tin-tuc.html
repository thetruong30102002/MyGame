<!doctype html>
<html lang="vi" data-theme="aether">
<head>
<meta charset="utf-8">
<script>
	// …/tin-tuc/ (thừa "/" cuối) thì đường dẫn tương đối api/…, site/… trỏ sai gốc → bỏ "/".
	if (/\/[a-z-]+\/$/.test(location.pathname) && !/\/game\/$/.test(location.pathname)) location.replace(location.pathname.slice(0, -1) + location.search + location.hash);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tin tức — Aether Chronicle</title>
<meta name="description" content="Tin cập nhật, thông báo và sự kiện của Aether Chronicle.">
<meta name="theme-color" content="#0d1a2a">
<link rel="icon" href="site/img/favicon.png">
<link rel="preload" href="site/fonts/bvp-400-vietnamese.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="site/app.css">
</head>
<body data-page="tin-tuc" class="bg-base-200 text-base-content antialiased overflow-x-hidden">
<main id="main">
	<header class="max-w-3xl mx-auto px-4 pt-6 pb-4 sm:pt-12 sm:pb-6">
		<p class="text-xs font-black tracking-widest text-primary">TIN TỨC</p>
		<h1 class="mt-1 text-[28px] sm:text-4xl font-black leading-tight">Cập nhật & thông báo</h1>
		<p class="mt-2 text-[15px] text-base-content/65">Mọi thay đổi của game, mới nhất ở trên.</p>
	</header>

	<!-- Bộ lọc: cuộn ngang, dính dưới thanh trên -->
	<div class="sticky top-[calc(3.5rem+env(safe-area-inset-top))] sm:top-[calc(4rem+env(safe-area-inset-top))] z-20 bar border-y border-white/5">
		<div id="tabs" role="tablist" class="no-bar max-w-3xl mx-auto px-4 py-2.5 flex gap-2 overflow-x-auto"></div>
	</div>

	<div class="max-w-3xl mx-auto px-4 py-5 sm:py-8">
		<ol id="news" class="space-y-4">
			<li class="skeleton h-48"></li><li class="skeleton h-48"></li>
		</ol>
		<div class="text-center mt-6" id="more-wrap" hidden><button id="more" class="btn bg-base-100 border-white/10 w-full sm:w-auto">Xem tin cũ hơn</button></div>
	</div>
</main>

<script src="site/vendor/sweetalert2.min.js"></script>
<script src="site/common.js"></script>
<script>
(function () {
	const { $, h } = A;
	const PAGE = 8;
	let news = [], filter = '', shown = PAGE;
	const fresh = (n) => (n.at ? Date.now() - n.at < 2 * 864e5 : false);

	// Chip lọc: biểu tượng + chữ, cao 40px.
	const TABS = [['', 'Tất cả', 'list'], ['Cập nhật', 'Cập nhật', 'wrench'], ['Thông báo', 'Thông báo', 'megaphone'], ['Sự kiện', 'Sự kiện', 'sparkles']];
	function renderTabs() {
		$('tabs').replaceChildren(...TABS.map(([f, label, icon]) => {
			const on = f === filter;
			const b = h('button.btn.btn-sm.h-10.min-h-10.px-4.rounded-full.gap-1.5.shrink-0.' + (on ? 'btn-primary' : 'btn-ghost.bg-base-100.border-white/10'), { type: 'button', role: 'tab', ariaSelected: on }, A.icon(icon, 'w-4 h-4'), label);
			b.onclick = () => {
				filter = f;
				shown = PAGE;
				renderTabs();
				render();
			};
			return b;
		}));
	}
	function render() {
		const list = news.filter((n) => !filter || n.tag === filter);
		$('news').replaceChildren(...(list.length ? list.slice(0, shown) : [null]).map((n) =>
			!n
				? h('li.text-center.py-12.text-base-content/60', null, 'Chưa có tin nào ở mục này.')
				: h('li.scroll-mt-32', { id: n.id ? 'tin-' + n.id : '' },
					h('article.rounded-2xl.bg-base-100.border.border-white/10.p-5.sm:p-6', null,
						h('div.flex.items-center.gap-2', null,
							h('span.badge.badge-sm.font-semibold.' + (A.NEWS_TAG_CLS[n.tag] || 'badge-ghost'), null, n.tag),
							fresh(n) ? h('span.badge.badge-sm.badge-warning.font-semibold', null, 'Mới') : null,
							h('time.text-[13px].text-base-content/55', null, n.date),
							n.id ? h('button.btn.btn-ghost.btn-circle.btn-sm.w-10.h-10.min-h-10.ml-auto.-my-2.-mr-2.text-base-content/60', { type: 'button', ariaLabel: 'Chia sẻ tin', onclick: () => share(n) }, A.icon('link', 'w-[18px] h-[18px]')) : null,
						),
						h('h2.mt-3.text-xl.sm:text-2xl.font-black.leading-snug', null, n.title),
						h('ul.mt-3.space-y-2.5', null, n.body.map((l) => h('li.flex.gap-3.text-[15px].leading-relaxed.text-base-content/85', null, h('span.mt-[9px].w-1.5.h-1.5.rounded-full.bg-primary.shrink-0'), h('span.min-w-0', null, l)))),
					),
				),
		));
		$('more-wrap').hidden = list.length <= shown;
	}
	async function share(n) {
		const url = location.href.split('#')[0] + '#tin-' + n.id;
		try {
			if (navigator.share) await navigator.share({ title: n.title, url });
			else {
				await navigator.clipboard.writeText(url);
				A.toast('Đã chép link tin');
			}
		} catch (e) {}
	}
	fetch('api/news?limit=200', { cache: 'no-store' })
		.then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
		.catch(() => fetch('site/news.json', { cache: 'no-store' }).then((r) => r.json()))
		.then((list) => {
			news = list;
			// Link tới một tin cũ (…#tin-12) → mở đủ trang để thấy tin đó.
			const want = location.hash.slice(1);
			const idx = news.findIndex((n) => 'tin-' + n.id === want);
			if (idx >= shown) shown = idx + 1;
			render();
			if (idx >= 0) {
				const el = $(want);
				el.scrollIntoView({ block: 'start' });
				el.querySelector('article').classList.add('border-primary/60', 'ring-2', 'ring-primary/25');
			}
		})
		.catch(() => $('news').replaceChildren(h('li.alert.alert-error', null, 'Không tải được tin tức.')));
	$('more').onclick = () => {
		shown += PAGE;
		render();
	};
	renderTabs();
})();
</script>
</body>
</html>
