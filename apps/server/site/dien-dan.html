<!doctype html>
<html lang="vi" data-theme="aether">
<head>
<meta charset="utf-8">
<script>
	// …/dien-dan/ (thừa "/" cuối) thì đường dẫn tương đối api/…, site/… trỏ sai gốc → bỏ "/".
	if (/\/[a-z-]+\/$/.test(location.pathname) && !/\/game\/$/.test(location.pathname)) location.replace(location.pathname.slice(0, -1) + location.search + location.hash);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diễn đàn — Aether Chronicle</title>
<meta name="description" content="Diễn đàn người chơi Aether Chronicle: tìm tổ đội, hỏi đáp, hướng dẫn, khoe đồ.">
<meta name="theme-color" content="#0d1a2a">
<link rel="icon" href="site/img/favicon.png">
<link rel="preload" href="site/fonts/bvp-400-vietnamese.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="site/app.css">
</head>
<body data-page="dien-dan" class="bg-base-200 text-base-content antialiased overflow-x-hidden">
<main id="main">
	<header class="max-w-6xl mx-auto px-4 pt-6 pb-4 sm:pt-12 sm:pb-6">
		<p class="text-xs font-black tracking-widest text-primary">DIỄN ĐÀN</p>
		<h1 class="mt-1 text-[28px] sm:text-4xl font-black leading-tight">Bảng tin người chơi</h1>
		<p class="mt-2 text-[15px] text-base-content/65">Tìm tổ đội, hỏi đáp, chia sẻ mẹo — đăng bằng tài khoản game.</p>
	</header>

	<!-- Thanh dính: tìm + viết bài + chuyên mục (cuộn ngang) -->
	<div class="sticky top-[calc(3.5rem+env(safe-area-inset-top))] sm:top-[calc(4rem+env(safe-area-inset-top))] z-20 bar border-y border-white/5">
		<div class="max-w-6xl mx-auto px-4 pt-2.5 flex gap-2">
			<label class="input input-bordered flex items-center gap-2 flex-1 min-w-0 h-11 min-h-11 bg-base-100">
				<svg class="i w-[18px] h-[18px] text-base-content/50" aria-hidden="true"><use href="#i-search"/></svg>
				<input id="q" type="search" class="grow min-w-0 h-full text-base" placeholder="Tìm bài viết…" enterkeyhint="search" aria-label="Tìm bài viết">
			</label>
			<button type="button" data-write class="btn btn-primary h-11 min-h-11 px-4 gap-1.5 shrink-0"><svg class="i w-[18px] h-[18px]" aria-hidden="true"><use href="#i-pencil"/></svg><span>Viết bài</span></button>
		</div>
		<div id="cats" class="no-bar max-w-6xl mx-auto px-4 py-2.5 flex gap-2 overflow-x-auto" role="tablist" aria-label="Chuyên mục"></div>
	</div>

	<section class="max-w-3xl mx-auto px-4 py-4 sm:py-8" aria-live="polite">
		<div class="flex items-baseline justify-between gap-3 mb-3">
			<h2 id="list-title" class="font-bold text-[17px] min-w-0 truncate">Tất cả bài viết</h2>
			<span id="list-count" class="text-sm text-base-content/55 shrink-0"></span>
		</div>
		<div id="posts" class="space-y-3">
			<div class="skeleton h-32"></div><div class="skeleton h-32"></div><div class="skeleton h-32"></div>
		</div>
		<div class="text-center mt-5" id="more-wrap" hidden><button id="more" class="btn bg-base-100 border-white/10 w-full sm:w-auto">Tải thêm bài</button></div>
		<a href="gop-y" class="mt-6 flex items-center gap-3 p-4 rounded-2xl bg-base-100 border border-white/10 text-sm card-hover">
			<span class="grid place-items-center w-10 h-10 rounded-xl bg-error/15 text-error shrink-0"><svg class="i w-5 h-5"><use href="#i-bug"/></svg></span>
			<span class="min-w-0"><b class="block">Gặp lỗi trong game?</b><span class="text-base-content/65">Báo ở trang Góp ý để đội làm game xử lý nhanh hơn.</span></span>
		</a>
	</section>
</main>

<dialog id="dlg-post" class="modal modal-bottom sm:modal-middle">
	<div class="modal-box border border-white/10 max-h-[92svh] pb-[calc(1.5rem+env(safe-area-inset-bottom))]">
		<form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute right-3 top-3" aria-label="Đóng"><svg class="i w-5 h-5"><use href="#i-x"/></svg></button></form>
		<h3 class="font-black text-2xl">Viết bài</h3>
		<form id="post-form" class="mt-4 space-y-3">
			<div class="grid grid-cols-2 gap-3">
				<label class="block min-w-0"><span class="block text-sm font-semibold mb-1.5">Chuyên mục</span>
					<select id="pf-cat" class="select select-bordered w-full text-base"></select></label>
				<label class="block min-w-0"><span class="block text-sm font-semibold mb-1.5">Đăng với tên</span>
					<select id="pf-char" class="select select-bordered w-full text-base"></select></label>
			</div>
			<label class="block"><span class="block text-sm font-semibold mb-1.5">Tiêu đề</span>
				<input id="pf-title" class="input input-bordered w-full text-base" maxlength="100" required enterkeyhint="next"></label>
			<label class="block"><span class="flex justify-between text-sm font-semibold mb-1.5"><span>Nội dung</span><span class="font-normal text-base-content/50"><span id="pf-cnt">0</span>/2000</span></span>
				<textarea id="pf-body" class="textarea textarea-bordered w-full min-h-36 text-base leading-relaxed" maxlength="2000" required></textarea></label>
			<div id="pf-err" role="alert" class="alert alert-error py-2 text-sm" hidden></div>
			<button class="btn btn-primary w-full gap-2" id="pf-go"><svg class="i w-5 h-5"><use href="#i-send"/></svg>Đăng bài</button>
		</form>
	</div>
	<form method="dialog" class="modal-backdrop"><button>đóng</button></form>
</dialog>

<script src="site/vendor/sweetalert2.min.js"></script>
<script src="site/common.js"></script>
<script>
(function () {
	const { $, h } = A;
	const PAGE = 15;
	const params = new URLSearchParams(location.search);
	let cat = params.get('c') in A.CATS ? params.get('c') : '';
	let q = '', posts = [], more = false, counts = null, loading = false;

	// —— Chuyên mục (chip cuộn ngang, cao 40px) ——
	function renderCats() {
		const items = [['', 'Tất cả', 'list', counts ? counts.total : null]].concat(Object.entries(A.CATS).map(([id, name]) => [id, name, A.CAT_ICON[id], counts ? counts.categories[id] : null]));
		$('cats').replaceChildren(...items.map(([id, name, icon, n]) => {
			const on = id === cat;
			const b = h('button.btn.btn-sm.h-10.min-h-10.pl-3.5.pr-3.rounded-full.gap-1.5.shrink-0.' + (on ? 'btn-primary' : 'btn-ghost.bg-base-100.border-white/10'), { type: 'button', role: 'tab', ariaSelected: on },
				A.icon(icon, 'w-4 h-4'), name,
				n != null ? h('span.min-w-[1.25rem].h-5.px-1.5.rounded-full.text-[11px].leading-5.text-center.' + (on ? 'bg-primary-content/15' : 'bg-white/10'), null, n) : null);
			b.onclick = () => {
				if (cat === id) return;
				cat = id;
				const u = new URL(location.href);
				cat ? u.searchParams.set('c', cat) : u.searchParams.delete('c');
				history.replaceState(null, '', u);
				renderCats();
				load(true);
			};
			return b;
		}));
		// Giữ chuyên mục đang chọn trong tầm nhìn khi cuộn ngang.
		const sel = $('cats').querySelector('[aria-selected="true"]');
		if (sel) $('cats').scrollLeft = Math.max(0, sel.offsetLeft - 16);
	}
	const loadCounts = () => A.api('GET', 'posts/counts').then((c) => ((counts = c), renderCats())).catch(() => {});

	// —— Danh sách bài ——
	async function load(reset) {
		if (loading) return;
		loading = true;
		if (reset) $('posts').replaceChildren(h('div.skeleton.h-32'), h('div.skeleton.h-32'));
		const qs = new URLSearchParams({ limit: PAGE });
		if (cat) qs.set('category', cat);
		if (q) qs.set('q', q);
		if (!reset && posts.length) qs.set('before', posts[posts.length - 1].id);
		try {
			const list = await A.api('GET', 'posts?' + qs);
			posts = reset ? list : posts.concat(list);
			more = list.length === PAGE;
			render();
		} catch (e) {
			$('posts').replaceChildren(h('div.alert.alert-error', null, e.message));
		} finally {
			loading = false;
		}
	}
	function render() {
		$('list-title').textContent = q ? 'Kết quả cho "' + q + '"' : cat ? A.CATS[cat] : 'Tất cả bài viết';
		$('list-count').textContent = posts.length ? posts.length + (more ? '+' : '') + ' bài' : '';
		if (!posts.length) {
			$('posts').replaceChildren(h('div.rounded-2xl.bg-base-100.border.border-white/10.py-12.px-6.text-center', null,
				A.icon(q ? 'search' : 'forum', 'w-12 h-12 mx-auto text-base-content/30'),
				h('p.mt-3.text-base-content/70', null, q ? 'Không thấy bài nào khớp.' : 'Chưa có bài nào ở đây.'),
				h('button.btn.btn-primary.mt-4.gap-2', { type: 'button', onclick: write }, A.icon('pencil', 'w-5 h-5'), 'Viết bài đầu tiên'),
			));
		} else $('posts').replaceChildren(...posts.map(card));
		$('more-wrap').hidden = !more;
	}
	function card(p) {
		return h('a.block.p-4.sm:p-5.rounded-2xl.bg-base-100.border.border-white/10.card-hover', { href: 'bai-viet?id=' + p.id },
			h('div.flex.items-center.gap-3', null,
				A.avatar(p.author, 'w-9.h-9.text-sm'),
				h('div.min-w-0.flex-1', null, h('p.font-semibold.text-sm.leading-tight.truncate', null, p.author), h('p.mt-0.5.text-xs.text-base-content/50.leading-tight', null, A.ago(p.at))),
				h('span.inline-flex.items-center.h-7.px-2.5.rounded-full.bg-white/5.border.border-white/10.text-xs.text-base-content/70.max-w-[45%].shrink-0', null, A.catLabel(p.category)),
			),
			h('h3.mt-3.font-bold.text-[17px].leading-snug.line-clamp-2.break-words', null, p.title),
			h('p.mt-1.5.text-sm.leading-relaxed.text-base-content/65.line-clamp-2.break-words', null, p.body),
			h('div.mt-3.flex.items-center.gap-3.text-[13px].text-base-content/55', null,
				h('span.inline-flex.items-center.gap-1.5', null, A.icon('chat', 'w-4 h-4'), p.comments + ' bình luận'),
				p.mine ? h('span.badge.badge-primary.badge-outline.badge-sm', null, 'Bài của bạn') : null,
			),
		);
	}
	$('more').onclick = () => load(false);
	// Tải thêm tự động khi cuộn gần cuối.
	if ('IntersectionObserver' in window) new IntersectionObserver((es) => es[0].isIntersecting && more && load(false), { rootMargin: '300px' }).observe($('more-wrap'));

	// —— Tìm chữ (gõ xong 0,35 giây mới tìm) ——
	let timer;
	$('q').addEventListener('input', () => {
		clearTimeout(timer);
		timer = setTimeout(() => {
			q = $('q').value.trim();
			load(true);
		}, 350);
	});
	$('q').addEventListener('keydown', (e) => e.key === 'Enter' && $('q').blur());

	// —— Viết bài ——
	$('pf-cat').replaceChildren(...Object.entries(A.CATS).map(([id, name]) => h('option', { value: id }, name)));
	A.autosize($('pf-body'), 360);
	$('pf-body').addEventListener('input', () => ($('pf-cnt').textContent = $('pf-body').value.length));
	A.onMe((me) => {
		$('pf-char').replaceChildren(...(me && me.characters.length ? me.characters.map((c) => h('option', { value: c.id }, c.name)) : [h('option', { value: '' }, me ? me.username : '—')]));
		if (posts.length) load(true); // cập nhật "Bài của bạn"
	});
	function write() {
		A.need(() => {
			$('pf-cat').value = cat || 'chung';
			A.showErr('pf-err');
			$('dlg-post').showModal();
		});
	}
	document.querySelectorAll('[data-write]').forEach((b) => (b.onclick = write));
	$('post-form').onsubmit = async (e) => {
		e.preventDefault();
		A.showErr('pf-err');
		$('pf-go').classList.add('btn-disabled');
		try {
			const p = await A.api('POST', 'posts', { title: $('pf-title').value, body: $('pf-body').value, category: $('pf-cat').value, characterId: $('pf-char').value || undefined });
			$('pf-title').value = $('pf-body').value = '';
			$('pf-cnt').textContent = '0';
			$('dlg-post').close();
			location.href = 'bai-viet?id=' + p.id + '&moi=1';
		} catch (x) {
			A.showErr('pf-err', x.message);
		} finally {
			$('pf-go').classList.remove('btn-disabled');
		}
	};

	renderCats();
	loadCounts();
	load(true);
	if (location.hash === '#viet') {
		history.replaceState(null, '', location.pathname + location.search);
		let done = false;
		A.onMe(() => {
			if (done) return;
			done = true;
			write();
		});
	}
})();
</script>
</body>
</html>
