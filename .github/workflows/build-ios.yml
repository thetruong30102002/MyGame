name: Build iOS

# Chạy tay (Actions → Build iOS → Run workflow) hoặc đẩy tag v* — ra file .ipa gắn vào GitHub Release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag Release để gắn .ipa (vd ios-1.0.1)'
        required: true
        default: 'ios-latest'
  push:
    tags: ['ios-*']

env:
  UNITY_VERSION: 6000.3.26f1

jobs:
  export-xcode:
    name: Unity xuất project Xcode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: UnityGame/Library
          key: Library-iOS-${{ hashFiles('UnityGame/Packages/manifest.json', 'UnityGame/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-iOS-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityGame
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: Aether.Importer.GameSetup.BuildIosCiBatch
          buildsPath: UnityGame/Build
          allowDirtyBuild: true
      - name: Nén project Xcode
        run: |
          sudo chown -R "$USER" UnityGame/Build
          rm -rf UnityGame/Build/iOS/Aether_BurstDebugInformation_DoNotShip
          tar -C UnityGame/Build -cf xcode-project.tar iOS
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.tar
          compression-level: 0
          retention-days: 1

  build-ipa:
    name: Xcode Archive ra .ipa
    needs: export-xcode
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.IOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
      - run: tar -xf xcode-project.tar
      - name: Nhập chứng chỉ ký (nếu có)
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KC=$RUNNER_TEMP/ci.keychain-db
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$CERT_P12" | base64 -d > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > $RUNNER_TEMP/p.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/p.mobileprovision)")
          cp $RUNNER_TEMP/p.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/p.mobileprovision)")" >> $GITHUB_ENV
          echo "SIGNED=true" >> $GITHUB_ENV
      - name: Archive
        working-directory: iOS
        run: |
          if [ "$SIGNED" = "true" ]; then
            xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
              -archivePath $RUNNER_TEMP/Aether.xcarchive archive \
              CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }} \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY="Apple Distribution"
          else
            xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
              -archivePath $RUNNER_TEMP/Aether.xcarchive archive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          fi
      - name: Xuất .ipa
        run: |
          mkdir out
          if [ "$SIGNED" = "true" ]; then
            cat > $RUNNER_TEMP/export.plist <<P
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>method</key><string>${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}</string>
          <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict><key>com.nttrg.aether</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          P
            xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Aether.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath out
          else
            mkdir Payload && cp -R $RUNNER_TEMP/Aether.xcarchive/Products/Applications/*.app Payload/
            zip -qry out/Aether-unsigned.ipa Payload
          fi
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.ipa
