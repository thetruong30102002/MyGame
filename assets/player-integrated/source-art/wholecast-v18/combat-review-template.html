<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhân vật · Đứng và ra đòn</title>
<style>*{box-sizing:border-box}body{margin:0;background:#141b1b;color:#eee8da;font:15px system-ui}main{max-width:1500px;padding:24px;margin:auto}p{color:#b4c0b8;line-height:1.5}h1{font-size:27px}button,select,input{font:inherit}button,select{cursor:pointer;border:1px solid #536151;border-radius:8px;background:#28342f;color:inherit;padding:9px 12px}button[aria-pressed=true]{background:#697243;border-color:#d8c581}button:disabled{opacity:.4}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;align-items:center}.layout{display:grid;grid-template-columns:minmax(390px,1fr) minmax(620px,1.1fr);gap:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hero{text-align:center;min-height:180px;padding:8px}.hero canvas{display:block;margin:auto;width:112px;height:112px}.hero strong{display:block;margin:6px 0}.hero small{color:#c8c5a9;font-size:12px}.preview{background:#202a29;border:1px solid #4b5c4d;border-radius:12px;padding:15px;min-width:0}canvas{image-rendering:pixelated;image-rendering:crisp-edges}.pair{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.pair figure{margin:0;text-align:center;max-width:100%;overflow:hidden}.pair canvas{display:block;width:288px;height:288px;max-width:100%;background:#182120;border-bottom:1px solid #6d845c}figcaption,.desc{font-size:12px;color:#aabbb1;line-height:1.6}.views{display:grid;grid-template-columns:repeat(4,1fr)}.views figure{margin:0;text-align:center}.views canvas{display:block;width:144px;height:144px;max-width:100%;margin:auto}.scrub{display:flex;gap:10px;align-items:center}.scrub input{flex:1;min-width:60px}#count,#frameLabel{color:#ded297}.status{border-left:3px solid #a9b66a;padding-left:10px}a{color:#e4d08d}@media(max-width:1120px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(6,1fr)}.preview{max-width:850px;margin:auto;width:100%}}@media(max-width:760px){main{padding:12px}.grid{grid-template-columns:repeat(3,1fr)}.hero{padding:3px}.hero canvas{max-width:100%}.pair canvas{width:144px;height:144px}}</style>
<main><h1>Nhân vật · Đứng và ra đòn</h1><p>5 class · Mỗi class 3 nam, 3 nữ · Tóc, đồ và một vũ khí vẽ liền trong từng frame.</p><p id="count"></p><div id="classes" class="bar"></div><div class="layout"><section><div id="grid" class="grid"></div><p class="status">Bản xem asset. 28 mẫu mới còn thiếu đi/chạy. Chưa đưa 30 mẫu vào bản game phát hành.</p><a href="http://127.0.0.1:8767/">Xem đi/chạy kiếm và trượng V17 đã duyệt</a></section><aside class="preview"><h2 id="name"></h2><div class="pair"><figure><canvas id="idle" width="144" height="144"></canvas><figcaption>Dáng đứng chuẩn · Cùng tỷ lệ</figcaption></figure><figure><canvas id="actor" width="144" height="144"></canvas><figcaption id="caption"></figcaption></figure></div><div id="modes" class="bar"></div><div class="bar"><button id="play">Tạm dừng</button><button id="step">Tiến 1 frame</button><label>Tốc độ <select id="fps"><option>8</option><option>12</option><option selected>16</option><option>20</option></select> fps</label><label>Phóng <select id="zoom"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select></label></div><div class="scrub"><input id="scrub" aria-label="Frame ra đòn" type="range" min="0" max="11" value="0"><span id="frameLabel"></span></div><div id="directions" class="bar"></div><p id="detail" class="desc"></p><div id="views" class="views"></div></aside></div></main>
<script>
const R=__ROSTER_DATA__,A=__COMBAT_DATA__,ROLES={sword:'Kiếm',bow:'Cung',staff:'Trượng',spear:'Thương',shield:'Khiên'},ACT={attack:'Bổ kiếm hai tay',cast:'Niệm và phóng phép',shoot:'Kéo cung và bắn',thrust:'Đâm thương hai tay',bash:'Tấn công bằng khiên'},DN=['Nam','Đông Nam','Đông','Đông Bắc','Bắc','Tây Bắc','Tây','Tây Nam'];
const $=x=>document.getElementById(x),images={},animations={};let role='staff',selected='player_staff_m01',direction=0,frame=0,playing=true,mode='transition',tick=0,prev=0,views=[];
function load(src){const im=new Image;im.src=src;im.addEventListener('load',paint);return im}R.forEach(c=>{if(c.sheetData)images[c.id]=load(c.sheetData)});Object.entries(A).forEach(([id,a])=>animations[id]=load(a.sheetData));
function idle(cv,c,d,pad=true){const x=cv.getContext('2d'),im=images[c.id];x.clearRect(0,0,cv.width,cv.height);x.imageSmoothingEnabled=false;if(im?.complete&&im.naturalWidth)x.drawImage(im,d%4*112,Math.floor(d/4)*112,112,112,pad?16:0,pad?28:0,112,112)}
function attack(cv,c,d){const x=cv.getContext('2d'),im=animations[c.id];if(!im?.complete||!im.naturalWidth){idle(cv,c,d);return}x.clearRect(0,0,144,144);x.imageSmoothingEnabled=false;x.drawImage(im,frame*144,d*144,144,144,0,0,144,144)}
function paint(){const c=R.find(c=>c.id===selected);if(!c)return;const active=mode==='attack'||mode==='transition'&&tick>=8&&tick<20;idle($('idle'),c,direction);if(active&&A[c.id])attack($('actor'),c,direction);else idle($('actor'),c,direction);views.forEach((cv,d)=>active&&A[c.id]?attack(cv,c,d):idle(cv,c,d));$('scrub').value=frame;$('frameLabel').textContent='Frame '+(frame+1)+' / 12';$('caption').textContent=A[c.id]?(active?ACT[A[c.id].action]:'Đứng yên · Chờ ra đòn'):'Chưa có đủ frame ra đòn'}
function reset(){tick=frame=prev=0;paint()}function modes(){$('modes').replaceChildren();[['idle','Đứng yên'],['attack','Ra đòn'],['transition','Đứng → ra đòn → đứng']].forEach(([key,label])=>{const b=document.createElement('button');b.textContent=label;b.disabled=key!=='idle'&&!A[selected];b.setAttribute('aria-pressed',key===mode);b.onclick=()=>{mode=key;modes();reset()};$('modes').append(b)})}
function detail(){const c=R.find(c=>c.id===selected),a=A[c.id];$('name').textContent=c.label+' · '+ROLES[c.role];$('directions').replaceChildren();DN.forEach((label,d)=>{const b=document.createElement('button');b.textContent=label;b.style.fontSize='12px';b.setAttribute('aria-pressed',direction===d);b.onclick=()=>{direction=d;detail();reset()};$('directions').append(b)});$('detail').textContent=(c.gender==='male'?'Nam':'Nữ')+' '+c.index+' / 3 · '+(a?'12 frame × 8 hướng · '+ACT[a.action]+'. '+(a.issues.length?'Cần rà lại: '+a.issues.join(', '):''):'Chưa có đầy đủ ra đòn. ')+(c.reference?'Mẫu V17 đã duyệt.':a?.visualReview==='inspected-native'?' Đã rà từng frame; chưa có đi/chạy.':' Mẫu mới đang rà hình vẽ; chưa có đi/chạy.');$('views').replaceChildren();views=[];DN.forEach(label=>{const fig=document.createElement('figure'),cv=document.createElement('canvas'),cap=document.createElement('figcaption');cv.width=cv.height=144;cap.textContent=label;fig.append(cv,cap);$('views').append(fig);views.push(cv)});modes();paint()}
function build(){$('classes').replaceChildren();Object.entries(ROLES).forEach(([key,label])=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',role===key);b.onclick=()=>{role=key;selected=R.find(c=>c.role===key).id;build();reset()};$('classes').append(b)});$('grid').replaceChildren();R.filter(c=>c.role===role).forEach(c=>{const b=document.createElement('button'),cv=document.createElement('canvas'),name=document.createElement('strong'),sub=document.createElement('small');b.className='hero';b.setAttribute('aria-pressed',selected===c.id);cv.width=cv.height=112;name.textContent=c.label;sub.textContent=(c.gender==='male'?'Nam ':'Nữ ')+c.index+' · '+(A[c.id]?'Có ra đòn':'Chỉ đứng');b.append(cv,name,sub);b.onclick=()=>{selected=c.id;build();reset()};$('grid').append(b);idle(cv,c,0,false);images[c.id]?.addEventListener('load',()=>idle(cv,c,0,false),{once:true})});detail()}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Tạm dừng':'Phát';prev=0};$('step').onclick=()=>{playing=false;$('play').textContent='Phát';mode='attack';frame=(frame+1)%12;modes();paint()};$('scrub').oninput=e=>{playing=false;$('play').textContent='Phát';mode='attack';frame=Number(e.target.value);modes();paint()};$('zoom').onchange=e=>document.querySelectorAll('.pair canvas').forEach(cv=>cv.style.width=cv.style.height=144*Number(e.target.value)+'px');$('fps').onchange=()=>prev=0;
function loop(t){if(playing&&t-prev>=1000/Number($('fps').value)){prev=t;if(mode==='attack')frame=(frame+1)%12;else if(mode==='transition'){tick=(tick+1)%30;frame=Math.max(0,Math.min(11,tick-8))}paint()}requestAnimationFrame(loop)}$('count').textContent='Tạo hình: '+R.length+'/30 · Có sheet ra đòn: '+Object.keys(A).length+'/30 · Có cả đi/chạy: 2/30';build();requestAnimationFrame(loop);
</script></html>
